global:
  scrape_interval: 60s
  evaluation_interval: 60s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/support-lab.rules.yml
