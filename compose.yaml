# Support with its command sandbox. See docs/container.md.
#   support  Support server, on http://127.0.0.1:4173.
#   sandbox  Runs the agent's Claude Code sessions and shell commands. Contains no credentials.
#            Only support reaches it, on the agent network.
# Variables:
#   CLAUDE_ACCESS_PATH       Host folder shared with agent sessions, mounted at the same path. Default: ~/claude_access.
name: support

x-hardening: &hardening
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  sysctls:
    net.ipv6.conf.all.disable_ipv6: 1
    net.ipv6.conf.default.disable_ipv6: 1

services:
  support:
    <<: *hardening
    build:
      context: .
    image: support:local
    environment:
      SUPPORT_SANDBOX_URL: http://172.31.251.20:7070
      # Address of the Git proxy (7071) and the agent gateway (7072).
      SUPPORT_RELAY_BIND: 172.31.251.10
      # Shared folder of agent sessions, at the same path as on the host. Read-only here.
      SUPPORT_CLAUDE_ACCESS_PATH: ${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - support-data:/data
      - ${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}:${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}:ro
    networks:
      agent:
        ipv4_address: 172.31.251.10
    depends_on: [sandbox]

  sandbox:
    <<: *hardening
    build:
      context: sandbox
    image: support-sandbox:local
    # NET_ADMIN is used by the entrypoint for iptables only. The server keeps setuid, setgid, setpcap and kill.
    cap_add: [NET_ADMIN]
    environment:
      SANDBOX_SUPPORT_ADDRESS: 172.31.251.10
      SANDBOX_BIND: 172.31.251.20:7070
      CLAUDE_ACCESS_PATH: ${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}
      SANDBOX_AGENT_ROOT: ${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}/.support-agent/work
    volumes:
      - ${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}:${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}
    # Empty folders over the claude-jail credential folders, when ~/claude_access contains claude-jail.
    tmpfs:
      - ${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}/claude-jail/provision:size=1m
      - ${CLAUDE_ACCESS_PATH:-${HOME}/claude_access}/claude-jail/.claude:size=1m
    networks:
      agent:
        ipv4_address: 172.31.251.20

networks:
  # Only support and sandbox join this network. It also gives both services internet access.
  agent:
    ipam:
      config:
        - subnet: 172.31.251.0/24

volumes:
  support-data: {}
