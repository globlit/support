# Egress proxy of the Support sandbox.
# Allows HTTPS CONNECT on port 443 to the hostnames listed in /etc/squid/allowlist.txt. Traffic is not decrypted.
# Plain HTTP, other ports, and every other hostname are denied.
http_port 3128

acl sandbox src 172.31.251.20
acl allowed dstdomain "/etc/squid/allowlist.txt"
acl tls_port port 443
acl connect method CONNECT

http_access deny !sandbox
http_access allow connect tls_port allowed
http_access deny all

cache deny all
pinger_enable off
via off
forwarded_for delete
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
coredump_dir /tmp
